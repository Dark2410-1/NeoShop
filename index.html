<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <title>NeoShop – Premium Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-950 text-gray-100">

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-50 glass border-b border-white/10">
  <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">

    <div class="text-2xl font-extrabold tracking-wide">
      <span class="text-indigo-400">Neo</span>Shop
    </div>

    <nav class="hidden md:flex gap-6 text-sm">
      <a href="#products" class="hover:text-indigo-400">Mahsulotlar</a>
      <a href="#about" class="hover:text-indigo-400">Biz haqimizda</a>
      <a href="#contact" class="hover:text-indigo-400">Aloqa</a>
    </nav>

    <button onclick="toggleCart()" class="relative">
      🛒
      <span id="cartCount"
        class="absolute -top-2 -right-2 bg-indigo-600 text-xs px-2 rounded-full">0</span>
    </button>
  </div>
</header>

<!-- ================= HERO ================= -->
<section class="max-w-7xl mx-auto px-6 py-24 text-center">
  <h1 class="text-4xl md:text-6xl font-extrabold mb-6">
    Premium texnologiyalar <br>
    <span class="text-indigo-400">bir joyda</span>
  </h1>
  <p class="text-gray-400 max-w-xl mx-auto mb-8">
    Eng so‘nggi gadjetlar, sifat va zamonaviy dizayn.
  </p>
  <a href="#products" class="btn-primary inline-block">
    Xarid qilish
  </a>
</section>

<!-- ================= PRODUCTS ================= -->
<section id="products" class="max-w-7xl mx-auto px-6 pb-24">
  <h2 class="text-3xl font-bold mb-10 text-center">Mahsulotlar</h2>

  <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">

    <!-- PRODUCT -->
    <div class="product-card glass p-5">
      <span class="badge">NEW</span>
      <img src="https://picsum.photos/400/300?1" class="rounded-xl mb-4">
      <h3 class="font-semibold">Wireless Headphones</h3>
      <p class="text-gray-400 text-sm mb-3">$120</p>
      <button class="btn-primary w-full"
        onclick="addToCart('Wireless Headphones',120)">
        Savatga qo‘shish
      </button>
    </div>

    <div class="product-card glass p-5">
      <img src="https://picsum.photos/400/300?2" class="rounded-xl mb-4">
      <h3 class="font-semibold">Smart Watch</h3>
      <p class="text-gray-400 text-sm mb-3">$90</p>
      <button class="btn-primary w-full"
        onclick="addToCart('Smart Watch',90)">
        Savatga qo‘shish
      </button>
    </div>

    <div class="product-card glass p-5">
      <span class="badge bg-red-500">HOT</span>
      <img src="https://picsum.photos/400/300?3" class="rounded-xl mb-4">
      <h3 class="font-semibold">Gaming Mouse</h3>
      <p class="text-gray-400 text-sm mb-3">$45</p>
      <button class="btn-primary w-full"
        onclick="addToCart('Gaming Mouse',45)">
        Savatga qo‘shish
      </button>
    </div>

  </div>
</section>

<!-- ================= CART ================= -->
<div id="cart"
  class="fixed top-0 right-0 w-80 h-full bg-slate-900 border-l border-white/10
         transform translate-x-full transition z-50 p-5">

  <h3 class="text-xl font-bold mb-4">🛒 Savat</h3>
  <div id="cartItems" class="space-y-3 text-sm"></div>

  <div class="mt-6 border-t border-white/10 pt-4">
    <p class="mb-3">Jami: $<span id="cartTotal">0</span></p>
    <button class="btn-primary w-full">Buyurtma berish</button>
  </div>
</div>

<!-- ================= FOOTER ================= -->
<footer class="text-center py-10 text-gray-400 text-sm">
  © 2026 NeoShop. Barcha huquqlar himoyalangan.
</footer>

<script src="script.js"></script>
</body>
</html>
